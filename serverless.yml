org: luisnieva
service: ms-recursos

provider:
  name: aws
  runtime: python3.12
  timeout: 30
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    TOPIC_RECURSOS_ARN: arn:aws:sns:${aws:region}:${aws:accountId}:tema-recursos

functions:
  # ---------- Recursos ----------
  crearRecurso:
    name: CrearRecurso
    handler: crear_recurso.lambda_handler
    events:
      - http:
          path: /recursos/crear
          method: post
          cors: true
          integration: lambda
  listarRecursos:
    name: ListarRecursos
    handler: listar_recursos.lambda_handler
    events:
      - http:
          path: /recursos/listar
          method: post
          cors: true
          integration: lambda
  buscarRecurso:
    name: BuscarRecurso
    handler: buscar_recurso.lambda_handler
    events:
      - http:
          path: /recursos/buscar
          method: post
          cors: true
          integration: lambda
  modificarRecurso:
    name: ModificarRecurso
    handler: modificar_recurso.lambda_handler
    events:
      - http:
          path: /recursos/modificar
          method: put
          cors: true
          integration: lambda
  eliminarRecurso:
    name: EliminarRecurso
    handler: eliminar_recurso.lambda_handler
    events:
      - http:
          path: /recursos/eliminar
          method: delete
          cors: true
          integration: lambda

  # ---------- Asignaciones ----------
  crearAsignacion:
    name: CrearAsignacion
    handler: crear_asignacion.lambda_handler
    events:
      - http:
          path: /asignaciones/crear
          method: post
          cors: true
          integration: lambda
  listarAsignaciones:
    name: ListarAsignaciones
    handler: listar_asignaciones.lambda_handler
    events:
      - http:
          path: /asignaciones/listar
          method: post
          cors: true
          integration: lambda

resources:
  Resources:
    TablaRecursos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_recursos
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: recurso_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: recurso_id
            KeyType: RANGE
    TablaAsignaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_asignaciones
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: asignacion_id
            AttributeType: S
          - AttributeName: proyecto_id
            AttributeType: S
          - AttributeName: recurso_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: asignacion_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: gsi_proyecto
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: proyecto_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: gsi_recurso
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: recurso_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    TemaRecursos:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: tema-recursos

    # Presupuestos suma el costo de la asignacion a costo_proyectado
    # (la cola la crea ms-presupuestos, hay que desplegarlo antes)
    SuscripcionPresupuestosARecursos:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref TemaRecursos
        Protocol: sqs
        Endpoint: arn:aws:sqs:${aws:region}:${aws:accountId}:cola-presupuestos-asignaciones
        FilterPolicy:
          tipo_evento:
            - AsignacionCreada
